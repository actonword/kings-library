<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#0A121C;font-family:-apple-system,Segoe UI,Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0A121C;padding:40px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="background:#141F2C;border-radius:10px;padding:36px 32px;">
            <tr>
              <td align="center" style="font-family:Georgia,serif;font-size:20px;font-weight:600;color:#E9E2D0;padding-bottom:6px;">
                King's Library
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:13px;color:#93A0A8;padding-bottom:28px;">
                Enter this code to sign in to your library.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <span style="display:inline-block;font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:8px;color:#F0C25E;background:#1B2836;border-radius:8px;padding:14px 22px;">
                  {{ .Token }}
                </span>
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:11.5px;color:#93A0A8;line-height:1.6;">
                This code expires in 1 hour. If you didn't request this, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
